name: NovaCode Cloud CI

on:
  push:
    branches: ["novacode-cloud-implementation-8109331521118669701"]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          set -e
          for f in scripts/*.sh tests/*.sh kaggle/*.sh; do
            bash -n "$f"
          done
      - name: JSON validation
        run: |
          python3 -m json.tool config/opencode.json >/dev/null
          python3 -m json.tool kaggle/NovaCode_Cloud.ipynb >/dev/null
      - name: Secret pattern check
        run: |
          ! grep -RInE 'ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' --exclude-dir=.git .
